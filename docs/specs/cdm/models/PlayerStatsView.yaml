model: PlayerStatsView
kind: view
version: '1.0'
source: server/cqrs/shared/schemas.py
description: Per-player match detail row including class breakdown.
fields:
- name: steam_id
  type: string
  required: true
- name: match_id
  type: uuid
  required: true
- name: team
  type: string
  required: true
- name: display_name
  type: string
  required: false
- name: classes_played
  type: array<string>
  required: true
- name: primary_class
  type: string
  required: false
  default: unknown
- name: playtime_seconds
  type: integer
  required: false
  default: 0
- name: kills
  type: integer
  required: true
- name: deaths
  type: integer
  required: true
- name: assists
  type: integer
  required: true
- name: damage_per_minute
  type: float
  required: true
- name: healing_done
  type: integer
  required: true
- name: damage_received
  type: integer
  required: false
  default: 0
- name: heals_received
  type: integer
  required: false
  default: 0
- name: ubers
  type: integer
  required: false
  default: 0
- name: drops
  type: integer
  required: false
  default: 0
- name: captures
  type: integer
  required: false
  default: 0
- name: headshots
  type: integer
  required: false
  default: 0
- name: backstabs
  type: integer
  required: false
  default: 0
- name: airshots
  type: integer
  required: false
  default: 0
- name: rating
  type: float
  required: false
  default: 1.0
- name: class_stats
  type: array<ClassStatView>
  required: false
  default: []
