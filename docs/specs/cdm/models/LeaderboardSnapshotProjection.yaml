model: LeaderboardSnapshotProjection
kind: persistence-read
version: '1.0'
source: server/cqrs/query_service/app/models.py
database: cqrs_query
table: leaderboard_snapshot_view
constraints:
- unique(tournament_id, steam_id, class_name)
fields:
- name: id
  type: integer
  required: false
  primary_key: true
- name: tournament_id
  type: string
  required: true
  indexed: true
- name: steam_id
  type: string
  required: true
  indexed: true
- name: class_name
  type: string
  required: true
  default: ''
  description: Empty string = all-classes aggregate
  indexed: true
- name: matches_played
  type: integer
  required: true
  default: 0
- name: total_kills
  type: integer
  required: true
  default: 0
- name: total_deaths
  type: integer
  required: true
  default: 0
- name: total_assists
  type: integer
  required: true
  default: 0
- name: average_damage_per_minute
  type: float
  required: true
  default: 0.0
- name: total_healing_done
  type: integer
  required: true
  default: 0
- name: average_rating
  type: float
  required: true
  default: 1.0
- name: primary_class
  type: string
  required: true
  default: unknown
- name: updated_at
  type: datetime
  required: true
