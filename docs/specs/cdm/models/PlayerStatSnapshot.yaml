model: PlayerStatSnapshot
kind: domain
version: '1.0'
source: server/cqrs/shared/schemas.py
description: Per-player stats embedded in MatchParsed integration events.
fields:
- name: steam_id
  type: string
  required: true
- name: team
  type: string
  required: true
  description: blu or red
- name: display_name
  type: string
  required: false
- name: classes_played
  type: array<string>
  required: false
  default: []
- name: primary_class
  type: string
  required: false
  default: unknown
- name: playtime_seconds
  type: integer
  required: false
  default: 0
- name: kills
  type: integer
  required: false
  default: 0
- name: deaths
  type: integer
  required: false
  default: 0
- name: assists
  type: integer
  required: false
  default: 0
- name: damage_per_minute
  type: float
  required: false
  default: 0.0
- name: healing_done
  type: integer
  required: false
  default: 0
- name: damage_received
  type: integer
  required: false
  default: 0
- name: heals_received
  type: integer
  required: false
  default: 0
- name: ubers
  type: integer
  required: false
  default: 0
- name: drops
  type: integer
  required: false
  default: 0
- name: captures
  type: integer
  required: false
  default: 0
- name: headshots
  type: integer
  required: false
  default: 0
- name: backstabs
  type: integer
  required: false
  default: 0
- name: airshots
  type: integer
  required: false
  default: 0
- name: class_stats
  type: array<ClassStatSnapshot>
  required: false
  default: []
relationships:
- field: class_stats
  target: ClassStatSnapshot
  cardinality: 1:N
