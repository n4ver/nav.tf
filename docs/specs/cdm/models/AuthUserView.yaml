model: AuthUserView
kind: auth
version: '1.0'
source: server/cqrs/shared/schemas.py
description: Authenticated user profile returned by GET /api/auth/me.
fields:
- name: steam_id
  type: string
  required: true
- name: display_name
  type: string
  required: true
- name: avatar_url
  type: string
  required: false
- name: role
  type: string
  required: true
  description: player | admin
