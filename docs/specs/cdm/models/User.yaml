model: User
kind: persistence-write
version: '1.0'
source: server/cqrs/command_service/app/models.py
database: cqrs_command
table: users
description: Authenticated Steam account on the write side.
fields:
- name: id
  type: integer
  required: false
  primary_key: true
- name: steam_id
  type: string
  required: true
  unique: true
  indexed: true
- name: display_name
  type: string
  required: true
  default: ''
- name: avatar_url
  type: string
  required: false
- name: role
  type: enum
  required: true
  enum:
  - player
  - admin
  default: player
- name: created_at
  type: datetime
  required: true
- name: updated_at
  type: datetime
  required: true
- name: last_login_at
  type: datetime
  required: false
