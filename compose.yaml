# Local development stack. Run from the repository root:
#
#   cp .env.example .env
#   docker compose up -d --build                      # everything below except opt-in profiles
#   docker compose --profile consumer up -d api-consumer
#   docker compose --profile seed run --rm seed
#
# Production uses deploy/compose.prod.yml (see deploy/README.md). Both build the
# backend from the same image, deploy/docker/server.Dockerfile.
name: navtf

x-server-build: &server-build
  context: .
  dockerfile: deploy/docker/server.Dockerfile

services:
  rabbitmq:
    image: "rabbitmq:3.11.8-management-alpine"
    ports:
      - "15672:15672"
      - "5672:5672"
    hostname: rabbitmq
    restart: always

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cqrs_command
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cqrs_command"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Idempotently creates cqrs_query and the two pytest databases.
  db-init:
    image: postgres:15
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: user
      POSTGRES_DB: cqrs_command
      PGPASSWORD: password
    volumes:
      - ./deploy/postgres/ensure-cqrs-databases.sh:/ensure-cqrs-databases.sh:ro
      - ./server/cqrs/tests/ensure-test-databases.sh:/ensure-test-databases.sh:ro
    entrypoint: ["bash", "-c", "bash /ensure-cqrs-databases.sh && bash /ensure-test-databases.sh"]
    restart: "no"

  command-service:
    build: *server-build
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    ports:
      - "8001:8001"
    environment:
      CQRS_COMMAND_DATABASE_URL: postgresql+asyncpg://user:password@db:5432/cqrs_command
      SEED_CACHE_PATH: /app/data/seed_logs_cache.json
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
      SEED_SERVICE_TOKEN: ${SEED_SERVICE_TOKEN:-dev-seed-service-token}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8095}
      STEAM_OPENID_REALM: ${STEAM_OPENID_REALM:-http://localhost:8095}
      STEAM_OPENID_RETURN_TO: ${STEAM_OPENID_RETURN_TO:-http://localhost:8095/api/auth/steam/callback}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      BOOTSTRAP_ADMIN_STEAM_IDS: ${BOOTSTRAP_ADMIN_STEAM_IDS:-}
      # Admin → Ingest → matcha.tf proxies here (start it with --profile consumer).
      API_CONSUMER_URL: ${API_CONSUMER_URL:-http://api-consumer:8010}
      API_CONSUMER_API_KEY: ${WEBHOOK_API_KEY:-}
    volumes:
      - ./server/data:/app/data:ro
      - ./server/cqrs:/app/cqrs:ro
    command: ["uvicorn", "cqrs.command_service.app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    restart: unless-stopped

  query-service:
    build: *server-build
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    ports:
      - "8002:8002"
    environment:
      CQRS_QUERY_DATABASE_URL: postgresql+asyncpg://user:password@db:5432/cqrs_query
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    volumes:
      - ./server/cqrs:/app/cqrs:ro
    command: ["uvicorn", "cqrs.query_service.app.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    restart: unless-stopped

  # Same-origin gateway on :8095 (mirrors deploy/Caddyfile in production).
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8095:80"
    volumes:
      - ./dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - command-service
      - query-service
    restart: unless-stopped

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_COMMAND_BASE_URL: /api/command
      VITE_QUERY_BASE_URL: /api/query
      VITE_AUTH_BASE_URL: /api/auth
      VITE_GATEWAY_PROXY_TARGET: http://gateway:80
    depends_on:
      - gateway

  api-consumer:
    build:
      context: ./api-consumer
    depends_on:
      rabbitmq:
        condition: service_started
    ports:
      - "8010:8010"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CQRS_EXCHANGE_NAME: tf2-events
      CQRS_DLX_NAME: tf2-events.dlx
      MATCHA_LEAGUE_ID: ${MATCHA_LEAGUE_ID:-1}
      MATCHA_DIVISION_ID: ${MATCHA_DIVISION_ID:-1}
      MATCHA_TOURNAMENT_NAME: ${MATCHA_TOURNAMENT_NAME:-Matcha.tf Minicup Invite}
      MATCHA_TOURNAMENT_SLUG: ${MATCHA_TOURNAMENT_SLUG:-matcha-tf-minicup-invite}
      POLL_CRON: ${API_CONSUMER_POLL_CRON:-*/5 * * * *}
      POLL_ENABLED: ${API_CONSUMER_POLL_ENABLED:-true}
      WEBHOOK_ENABLED: "true"
      LOG_LEVEL: info
      ACTOR_ID: api-consumer
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY:-}
    restart: unless-stopped
    profiles:
      - consumer

  # One-shot: replays server/data/seed_logs_cache.json through the command API.
  seed:
    build: *server-build
    depends_on:
      db-init:
        condition: service_completed_successfully
      command-service:
        condition: service_started
      query-service:
        condition: service_started
    environment:
      COMMAND_SERVICE_URL: http://command-service:8001
      QUERY_SERVICE_URL: http://query-service:8002
      CQRS_COMMAND_DATABASE_URL: postgresql+asyncpg://user:password@db:5432/cqrs_command
      CQRS_QUERY_DATABASE_URL: postgresql+asyncpg://user:password@db:5432/cqrs_query
      SEED_CACHE_PATH: /app/data/seed_logs_cache.json
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
      SEED_SERVICE_TOKEN: ${SEED_SERVICE_TOKEN:-dev-seed-service-token}
    command: ["python", "seed/seed_cqrs.py", "--http", "--no-fallback"]
    volumes:
      - ./server/data:/app/data:ro
      - ./server/seed:/app/seed:ro
    profiles:
      - seed
