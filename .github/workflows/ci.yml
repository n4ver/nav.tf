name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cqrs_command
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d cqrs_command"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
      - name: Create test databases
        env:
          PGHOST: 127.0.0.1
          POSTGRES_USER: user
          POSTGRES_DB: cqrs_command
        run: bash server/cqrs/tests/ensure-test-databases.sh
      - name: Install dependencies
        working-directory: server
        run: pip install -r requirements-dev.txt
      - name: Run tests (80% coverage gate)
        working-directory: server
        run: python -m pytest -q

  api-consumer:
    name: api-consumer (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api-consumer/package-lock.json
      - working-directory: api-consumer
        run: npm ci
      - working-directory: api-consumer
        run: npm test

  web:
    name: Web (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run test:run
      - working-directory: web
        run: npm run build

  images:
    name: Production images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/server.Dockerfile
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build web (Caddy) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build api-consumer image
        uses: docker/build-push-action@v6
        with:
          context: api-consumer
          push: false
          cache-from: type=gha,scope=api-consumer
          cache-to: type=gha,mode=max,scope=api-consumer
      - name: Validate production compose file
        run: |
          printf '%s\n' DOMAIN=ci.example.com ACME_EMAIL=ci@example.com IMAGE_REGISTRY=ci \
            IMAGE_TAG=ci POSTGRES_PASSWORD=ci RABBITMQ_PASSWORD=ci JWT_SECRET=ci \
            WEBHOOK_API_KEY=ci > "$RUNNER_TEMP/ci.env"
          docker compose -f deploy/compose.prod.yml --env-file "$RUNNER_TEMP/ci.env" config -q
