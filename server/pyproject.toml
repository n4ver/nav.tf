[project]
name = "cqrs-server"
version = "0.1.0"
description = "nav.tf CQRS backend: command and query services (see README.md)"
readme = "README.md"
authors = [
    { name = "n4ver", email = "nicholaslkchng@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aio-pika==9.4.3",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "asyncpg==0.30.0",
    "certifi==2026.2.25",
    "click==8.3.2",
    "colorama==0.4.6",
    "fastapi==0.135.3",
    "greenlet==3.4.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "psycopg2-binary==2.9.10",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pyjwt==2.10.1",
    "sqlalchemy==2.0.49",
    "sqlmodel==0.0.38",
    "starlette==1.0.0",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "uvicorn==0.44.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.uv]
package = false

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "Depends"]
