[pytest]
testpaths = cqrs/tests
pythonpath = .
asyncio_default_fixture_loop_scope = function
addopts =
    --strict-markers
    -ra
    --cov=cqrs
    --cov-config=dev-setup/python/.coveragerc
    --cov-report=html:dev-setup/python/htmlcov
    --cov-report=xml:dev-setup/python/coverage.xml
    --cov-fail-under=80
markers =
    asyncio: async tests
